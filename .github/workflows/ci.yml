name: build-and-validate

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:
    branches:
      - main
      - "work/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check frontend ES modules
        shell: bash
        run: |
          set -euo pipefail
          find frontend -type f -name '*.mjs' -print0 | xargs -0 -r -n1 node --check
          node --input-type=module -e "import('./frontend/audio/AudioManager.mjs').then(() => console.log('Audio module import passed'))"

      - name: Build Java server
        run: mvn -B -DskipTests package

      - name: Check patch whitespace
        run: git diff --check
